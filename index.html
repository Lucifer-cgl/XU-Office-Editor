<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>墟 · Office 编辑器</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <header class="app-bar">
      <div class="brand">
        <span class="brand-mark">墟</span>
        <span><strong>Office 编辑器</strong><small>文件只在当前浏览器中处理</small></span>
      </div>
      <div class="file-state">
        <span id="file-name">尚未打开文件</span>
        <span id="dirty-state" hidden>有未保存的修改</span>
      </div>
      <div class="actions">
        <button id="open-file" type="button" disabled>选择文件</button>
        <button id="save-file" type="button" class="primary" disabled>保存</button>
      </div>
    </header>

    <main class="workspace">
      <section id="loading" class="loading" aria-live="polite">
        <span class="spinner" aria-hidden="true"></span>
        <h1>正在启动本地 Office 引擎</h1>
        <p>首次加载需要下载浏览器端 LibreOffice 运行组件，之后可由浏览器缓存复用。</p>
      </section>
      <canvas id="qtcanvas" class="office-canvas" contenteditable="true" hidden></canvas>
    </main>

    <footer class="status-bar">
      <span id="status">正在初始化……</span>
      <span>Writer · Calc · Impress</span>
    </footer>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
